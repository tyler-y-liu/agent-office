[package]
edition = "2024"
name = "pixtuoid-core"
version = "0.21.0"
authors = ["Ivan Wang <ivanwng97@icloud.com>"]
build = false
exclude = [
    "tests/sources",
    "tests/pinned_by_claims.rs",
    "tests/lang_gates.rs",
    "tests/shim_stamp_parity.rs",
    "tests/socket_path_parity.rs",
    "tests/supported_sources_manifest.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Headless engine for pixtuoid — sources, state, sprites"
homepage = "https://github.com/pixtuoid/pixtuoid"
readme = false
keywords = [
    "terminal",
    "tui",
    "pixel-art",
    "ai-agents",
    "claude",
]
categories = [
    "command-line-utilities",
    "visualization",
]
license = "MIT"
repository = "https://github.com/pixtuoid/pixtuoid"

[features]
default = ["native"]
harness = [
    "serde_json/preserve_order",
    "windows-sys/Win32_Storage_FileSystem",
    "windows-sys/Win32_System_Com",
    "windows-sys/Win32_System_Pipes",
    "windows-sys/Win32_System_Registry",
    "windows-sys/Win32_UI_Shell",
    "dep:sha2",
    "dep:syn",
    "dep:regex",
]
native = [
    "dep:tokio",
    "dep:notify",
]

[lib]
name = "pixtuoid_core"
path = "src/lib.rs"

[[example]]
name = "bump"
path = "examples/bump.rs"

[[example]]
name = "capture_fixture"
path = "examples/capture_fixture.rs"
test = true

[[example]]
name = "hermetic"
path = "examples/hermetic.rs"
test = true

[[example]]
name = "issues"
path = "examples/issues.rs"

[[example]]
name = "tui_drive"
path = "examples/tui_drive.rs"
