[[test]]
name = "native_watch"
path = "tests/native_watch.rs"

[[test]]
name = "reducer"
path = "tests/reducer/main.rs"

[[test]]
name = "render"
path = "tests/render/main.rs"

[[test]]
name = "transport"
path = "tests/transport/main.rs"

[[test]]
name = "watcher"
path = "tests/watcher/main.rs"

[[bench]]
