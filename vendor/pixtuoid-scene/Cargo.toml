[package]
edition = "2024"
name = "pixtuoid-scene"
version = "0.21.0"
authors = ["Ivan Wang <ivanwng97@icloud.com>"]
build = "build.rs"
exclude = [
    "tests/site_badge_colors.rs",
    "tests/readme_chart_palette.rs",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Backend-agnostic render + simulation engine for pixtuoid"
homepage = "https://github.com/pixtuoid/pixtuoid"
readme = false
keywords = [
    "terminal",
    "tui",
    "pixel-art",
    "ai-agents",
    "claude",
]
categories = [
    "command-line-utilities",
    "visualization",
]
license = "MIT AND OFL-1.1"
repository = "https://github.com/pixtuoid/pixtuoid"

[features]
cutaway-assets = []
default = [
    "native",
    "cutaway-assets",
]
native = ["pixtuoid-core/native"]

[lib]
name = "pixtuoid_scene"
path = "src/lib.rs"

[[example]]
name = "corpus_check"
path = "examples/corpus_check.rs"
test = true
required-features = ["native"]

[[test]]
name = "model_boundary"
path = "tests/model_boundary.rs"

[[bench]]
name = "render_frame"
path = "benches/render_frame.rs"
harness = false

[dependencies.chrono]
version = "0.4"
features = ["clock"]
default-features = false

[dependencies.enum-map]
version = "3.1"

[dependencies.foldhash]
version = "0.2"
default-features = false

[dependencies.lru]
version = "0.18"
default-features = false

[dependencies.pixtuoid-core]
version = "0.21.0"
default-features = false

[dependencies.pixtuoid-lofi]
version = "0.3"

[dependencies.strum]
version = "0.28"
features = ["derive"]
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.tracing]
version = "0.1"

[dependencies.unicode-segmentation]
version = "1"

[dependencies.unicode-width]
version = "0.2"

[dev-dependencies.criterion]
version = "6"
features = ["cargo_bench_support"]
default-features = false
package = "codspeed-criterion-compat"

[dev-dependencies.pixtuoid-core]
version = "0.21.0"
features = ["harness"]
default-features = false

[dev-dependencies.proc-macro2]
version = "1"
default-features = false

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.snapbox]
version = "1"

