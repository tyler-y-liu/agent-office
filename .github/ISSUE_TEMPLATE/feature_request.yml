name: Feature request
description: Something the office should show, or an agent it should support.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to see or do
      description: Describe the situation first — several sessions in one repo, a long shell command, an agent that is not supported yet.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A rough idea is enough. If it changes the office layout or the seat rules, say what should happen to the sessions already there.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - The office (seats, rooms, layout)
        - Task summaries
        - Stuck detection
        - Jumping back to a session
        - A new agent
        - Configuration or CLI
        - Something else
    validations:
      required: true
