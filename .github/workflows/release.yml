name: release

# Push a tag like v0.1.0: builds a universal macOS binary, attaches it to a
# GitHub release, and points the Homebrew tap at it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Test
        run: cargo test --release --locked

      - name: Build universal binary
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist/agent-office
          lipo -create -output dist/agent-office/agent-office \
            target/aarch64-apple-darwin/release/agent-office \
            target/x86_64-apple-darwin/release/agent-office
          # The linker ad-hoc signs only the arm64 slice; sign both so codesign -v passes.
          codesign --force --sign - dist/agent-office/agent-office
          cp LICENSE README.md THIRD-PARTY-NOTICES.md dist/agent-office/
          # The binary embeds the OFL-licensed Fusion Pixel font, so the font
          # license and its upstream notices must ship beside it (OFL 1.1
          # condition 2, MIT "include the notice"). Copy them from the repo;
          # never from the runner's home directory.
          mkdir -p dist/agent-office/licenses
          cp assets/OFL-Fusion-Pixel.txt dist/agent-office/licenses/
          cp -R assets/LICENSES-Fusion-Pixel dist/agent-office/licenses/
          # Fail here, with the missing path in the log, rather than publishing
          # a release that is out of compliance.
          for f in LICENSE README.md THIRD-PARTY-NOTICES.md \
                   licenses/OFL-Fusion-Pixel.txt \
                   licenses/LICENSES-Fusion-Pixel/boutique-bitmap-7x7/OFL.txt \
                   licenses/LICENSES-Fusion-Pixel/galmuri/LICENSE.txt \
                   licenses/LICENSES-Fusion-Pixel/misaki/misaki.txt \
                   licenses/LICENSES-Fusion-Pixel/miseki-bitmap/LICENSE.txt; do
            test -s "dist/agent-office/$f" || { echo "missing from package: $f"; exit 1; }
          done
          grep -q "SIL OPEN FONT LICENSE Version 1.1" dist/agent-office/THIRD-PARTY-NOTICES.md \
            || { echo "THIRD-PARTY-NOTICES.md lacks the OFL text"; exit 1; }
          tar -C dist -czf "agent-office-$GITHUB_REF_NAME-macos-universal.tar.gz" agent-office
          tar -tzf "agent-office-$GITHUB_REF_NAME-macos-universal.tar.gz" | tee package-members.txt
          grep -qx "agent-office/THIRD-PARTY-NOTICES.md" package-members.txt \
            || { echo "tarball lacks THIRD-PARTY-NOTICES.md"; exit 1; }
          grep -qx "agent-office/licenses/OFL-Fusion-Pixel.txt" package-members.txt \
            || { echo "tarball lacks the font license"; exit 1; }
          # sha256 is computed from the final tarball, after the notices are in it.
          shasum -a 256 agent-office-*.tar.gz | tee agent-office.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            agent-office-*.tar.gz agent-office.sha256

      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          version=${GITHUB_REF_NAME#v}
          sha=$(cut -d' ' -f1 agent-office.sha256)
          git clone "https://x-access-token:$TAP_TOKEN@github.com/tyler-y-liu/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$version/g" -e "s/@SHA256@/$sha/g" \
            packaging/agent-office.rb.in > tap/Formula/agent-office.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-office.rb
          git commit -m "agent-office $version"
          git push
